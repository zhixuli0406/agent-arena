# G1 target allowlist: the provisioner may start only these images; anything not listed is refused.
# This is the first hard gate that keeps CTF matches confined to authorized, isolated targets.
#
# All are free open-source targets (sources in docs/research/ctf-targets.md: OWASP VWAD, vulhub).
# hosting field:
#   self = a harmless target shipped with this project; may use freehost (public on free hosting) or local.
#   oss  = a genuinely vulnerable open-source image; local only (isolated and private), never exposed publicly (ToS + safety).
images:
  - name: arena-warmup
    port: 8000
    kind: self
    hosting: [local, freehost]
    note: warmup recon target shipped with this project; offline, small, fast, serves only a fake flag

  - name: bkimminich/juice-shop
    port: 3000
    kind: oss
    hosting: [local]
    note: OWASP Juice Shop (Node, covers the OWASP Top 10)

  - name: vulnerables/web-dvwa
    port: 80
    kind: oss
    hosting: [local]
    note: DVWA (PHP, adjustable difficulty)

  - name: webgoat/webgoat
    port: 8080
    kind: oss
    hosting: [local]
    note: OWASP WebGoat (Java)

  - name: raesene/bwapp
    port: 80
    kind: oss
    hosting: [local]
    note: bWAPP (PHP/MySQL, 100+ web bugs)
