name: Arena free-cloud server

# Hosts the public match server (lobby + bring-your-own-agent connections + spectating) on a free GitHub runner:
# starts uvicorn + a Cloudflare quick tunnel for a public URL and writes it to server.json (the fixed Pages
# entry point reads it), so the frontend connects to the live server on page load. Restarts every 5 hours on
# a schedule for near-continuous uptime (Actions is free for public repos).
#
# This server holds and uses no one's model keys: players connect their own agents (with their own keys)
# via connect tokens. Visibly labelled, unrated House agents use the deterministic mock adapter as a
# low-traffic fallback; the public policy only allows remote (player-provided) and mock agents.
#
# Privilege separation: the write token is used only by git commands under the runner account (via env
# vars, never written to .git/config); the public-facing uvicorn runs as a separate system account "arena"
# with no sudo (no_new_privs, empty environment, no outbound network), from a read-only copy of the code
# in /opt/arena. Backups read files as arena with time and size limits, then sanitize_state.py rebuilds
# the content, so root never reads paths arena controls. Even if the server is compromised it cannot read
# the token, modify the repo, or push arbitrary content to the data branch.
# The "Verify isolation" step below tests these conditions and aborts if any fails.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to keep the server online"
        default: "300"
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write   # used only by the runner account's git push (server.json, data branch)

concurrency:
  group: arena-server
  cancel-in-progress: true   # a new server replaces the old one, so server.json always points to the latest

env:
  CLOUDFLARED_VERSION: "2026.10.0"
  # From that release's SHA256 list in the release notes, checked against the actual downloaded file
  CLOUDFLARED_SHA256: "d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db"

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install ".[server]"
      - name: Install cloudflared (pinned, checksum verified)
        run: |
          curl -fsSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
      - name: Restore lobby state (ratings, ladder)
        run: ./infra/state-sync.sh restore
      - name: Prepare isolated server account
        run: |
          set -e
          sudo useradd --system --create-home --shell /usr/sbin/nologin arena
          chmod 700 "$HOME"
          sudo mkdir -p /opt/arena
          git archive HEAD | sudo tar -x -C /opt/arena
          sudo mkdir -p /opt/arena/runs
          for f in lobby_state.json ladder.json; do
            if [ -f "runs/$f" ]; then sudo install -m 600 "runs/$f" "/opt/arena/runs/$f"; fi
          done
          sudo chown -R arena:arena /opt/arena/runs
          # The server only receives tunnel traffic over loopback; remote/mock agents under the public policy need no outbound access
          sudo iptables -A OUTPUT -m owner --uid-owner arena ! -o lo -j REJECT
          sudo ip6tables -A OUTPUT -m owner --uid-owner arena ! -o lo -j REJECT
          # no DNS either (the local stub at 127.0.0.53 forwards queries out). Name lookups through
          # systemd-resolved's varlink socket are not covered; the account holds no secrets to leak that way.
          for proto in udp tcp; do
            sudo iptables -A OUTPUT -m owner --uid-owner arena -o lo -p "$proto" --dport 53 -j REJECT
            sudo ip6tables -A OUTPUT -m owner --uid-owner arena -o lo -p "$proto" --dport 53 -j REJECT
          done
      - name: Verify isolation
        run: |
          set -e
          if sudo -u arena test -r "$GITHUB_WORKSPACE/.git/config"; then echo "arena can read the workspace"; exit 1; fi
          if sudo -u arena sudo -n true 2>/dev/null; then echo "arena has sudo"; exit 1; fi
          if grep -qi "extraheader\|authorization" .git/config; then echo ".git/config contains credentials"; exit 1; fi
          if sudo -u arena cat "/proc/$$/environ" >/dev/null 2>&1; then echo "arena can read the runner's environment"; exit 1; fi
          if sudo -u arena test -r "$RUNNER_TEMP"; then echo "arena can read RUNNER_TEMP"; exit 1; fi
          if id -nG arena | grep -qw docker; then echo "arena is in the docker group"; exit 1; fi
          if sudo -u arena curl -s --max-time 5 -o /dev/null https://github.com; then echo "arena has outbound network access"; exit 1; fi
          if sudo -u arena python3 -c "import socket;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(3);s.sendto(b'\x12\x34\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x06github\x03com\x00\x00\x01\x00\x01',('127.0.0.53',53));s.recv(512)" 2>/dev/null; then
            echo "arena can send DNS queries"; exit 1; fi
          # Run the real backup (no push) with a planted symlink: the runner's environment must never reach runs/.
          # /proc/<pid>/environ holds the environment from process start, so look for variables set at that point.
          sudo -u arena ln -sf "/proc/$$/environ" /opt/arena/runs/ladder.json
          before="$(sha256sum runs/ladder.json 2>/dev/null || true)"
          ARENA_BACKUP_DRY=1 ./infra/ci-backup.sh
          if grep -rqsE "RUNNER_TEMP=|GITHUB_WORKSPACE=" runs/; then echo "backup leaked the runner environment"; exit 1; fi
          if [ "$before" != "$(sha256sum runs/ladder.json 2>/dev/null || true)" ]; then echo "backup accepted a symlinked file"; exit 1; fi
          sudo rm -f /opt/arena/runs/ladder.json
          if [ -f runs/ladder.json ]; then sudo install -o arena -g arena -m 600 runs/ladder.json /opt/arena/runs/ladder.json; fi
          (cd /opt/arena && sudo setpriv --reuid=arena --regid=arena --init-groups --no-new-privs \
            env -i PATH=/usr/bin:/bin LD_LIBRARY_PATH="$pythonLocation/lib" "$(command -v python)" -c "import uvicorn, fastapi, server.app")
          echo "isolation ok"
      - name: Serve public lobby + tunnel
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # A public server never enables host adapters; abort if it is set, just in case
          if [ "${ARENA_ALLOW_HOST_ADAPTERS:-}" = "1" ]; then echo "ARENA_ALLOW_HOST_ADAPTERS must not be set on a public server"; exit 1; fi
          # Accept digits only so $(( )) arithmetic expansion can't be injected; cap at 340 (job timeout 350)
          MINUTES="${MINUTES:-300}"
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a positive integer"; exit 1 ;; esac
          MINUTES=$((10#$MINUTES))   # strip leading zeros so "08" is not read as octal
          if [ "$MINUTES" -gt 340 ]; then MINUTES=340; fi
          # git auth goes through env vars (/proc/<pid>/environ is readable only by the same account), never the command line or .git/config
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          unset GH_TOKEN
          git config user.email "actions@users.noreply.github.com"
          git config user.name "arena-bot"
          ( while true; do sleep 600; ./infra/ci-backup.sh || true; done ) &   # back up ratings every 10 minutes
          PY="$(command -v python)"
          # Server output goes to a runner-private file, not the public job log (prevents forged workflow commands)
          ( cd /opt/arena && sudo setpriv --reuid=arena --regid=arena --init-groups --no-new-privs \
              env -i PATH=/usr/bin:/bin HOME=/home/arena LD_LIBRARY_PATH="$pythonLocation/lib" \
              ARENA_HOUSE_AGENTS=4 ARENA_HOUSE_SEED_MATCHES=3 \
              "$PY" -m uvicorn server.app:app --host 127.0.0.1 --port 8798 --log-level warning \
              --limit-concurrency 300 --timeout-keep-alive 5 > "$RUNNER_TEMP/server.log" 2>&1 ) &
          ./cloudflared tunnel --url http://127.0.0.1:8798 --no-autoupdate > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 40); do URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' cf.log | head -1 || true); [ -n "$URL" ] && break; sleep 1; done
          [ -n "$URL" ] || { echo "tunnel timed out"; cat cf.log; exit 1; }
          for i in $(seq 1 30); do curl -fsS -o /dev/null "http://127.0.0.1:8798/api/health" && break; sleep 1; done
          curl -fsS -o /dev/null "http://127.0.0.1:8798/api/health" || { echo "server did not start"; tail -50 "$RUNNER_TEMP/server.log"; exit 1; }
          {
            echo "## Public match server is live"
            echo "- Server: $URL"
            echo "- Lobby: $URL/game/index.html"
            echo "- Join as a player: python -m clients.arena_connect --server $URL --name your-name --cmd \"your agent command\" (--lang zh-TW/zh-CN/en/ja)"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"server":"%s","updated":"%s"}\n' "$URL" "$(date -u +%FT%TZ)" > server.json
          git add server.json && git commit -m "chore: update live server URL" && git push || true
          echo "Server live at $URL for $MINUTES minutes"
          sleep $(( MINUTES * 60 ))
      - name: Final backup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          unset GH_TOKEN
          git config user.email "actions@users.noreply.github.com"
          git config user.name "arena-bot"
          ./infra/ci-backup.sh || true
