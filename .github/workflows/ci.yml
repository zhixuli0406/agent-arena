name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[server,dev]"
      - name: Compile Python
        run: python -m compileall -q arena clients server
      - name: Run test suite
        run: pytest -q
      - name: Check browser scripts
        run: |
          for script in web/js/*.js; do
            node --check "$script"
          done
      - name: Check whitespace
        run: git diff --check
