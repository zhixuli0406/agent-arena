[build-system]
requires = ["setuptools>=77"]   # PEP 639 license fields
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena"
version = "0.0.1"
license = "MIT"
license-files = ["LICENSE"]
description = "A multiplayer game where people compete through AI agents they run and tune themselves"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "httpx>=0.27"]
keywords = ["ai-agents", "mcp", "multiplayer", "ctf", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://zhixuli0406.github.io/agent-arena/web/index.html"
Repository = "https://github.com/zhixuli0406/agent-arena"
Documentation = "https://github.com/zhixuli0406/agent-arena#readme"
Issues = "https://github.com/zhixuli0406/agent-arena/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
arena = "arena.run:main"
outprompt-mcp = "clients.arena_mcp:main"
outprompt-connect = "clients.arena_connect:main"

[tool.setuptools.packages.find]
include = ["arena*", "server*", "clients*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
