[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena"
version = "0.0.1"
description = "A public online arena where players bring their own AI agents to compete on tasks"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
arena = "arena.run:main"

[tool.setuptools.packages.find]
include = ["arena*", "server*", "clients*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
