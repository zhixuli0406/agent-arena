# Real model match: local claude -p vs a mock baseline. Requires the claude CLI to be logged in locally.
mode: quiz
seed: 1
ratings_path: runs/ratings.json
timeout_seconds: 120
mode_config:
  questions:
    - id: cap-jp
      prompt: "What is the capital of Japan?"
      answer: "Tokyo"
      kind: contains
    - id: math-1
      prompt: "What is 17 times 23? Answer with the number only."
      answer: "391"
      kind: numeric
    - id: logic-1
      prompt: "A is taller than B, and B is taller than C. Who is the shortest? Answer with one letter only."
      answer: "C"
      kind: contains
agents:
  - id: claude
    adapter: claude_cli
    model: ""
    system_prompt: "You are a careful problem solver. Output only the final answer, with no explanation or extra text."
    prompt_author: louis
  - id: baseline
    adapter: mock
    model: mock-dumb
    prompt_author: baseline
    params:
      answers: ["Osaka", "390", "A"]
