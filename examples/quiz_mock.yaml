# Local offline match: mock vs mock, no keys and no Docker needed.
mode: quiz
seed: 1
ratings_path: runs/ratings.json
mode_config:
  questions:
    - id: cap-jp
      prompt: "What is the capital of Japan?"
      answer: "Tokyo"
      kind: contains
    - id: math-1
      prompt: "What is 17 times 23? Answer with the number only."
      answer: "391"
      kind: numeric
    - id: logic-1
      prompt: "A is taller than B, and B is taller than C. Who is the shortest? Answer with one letter only."
      answer: "C"
      kind: contains
agents:
  - id: alpha
    adapter: mock
    model: mock-smart
    prompt_author: author-x
    params:
      answers: ["Tokyo", "391", "C"]
  - id: beta
    adapter: mock
    model: mock-dumb
    prompt_author: author-y
    params:
      answers: ["Osaka", "390", "A"]
