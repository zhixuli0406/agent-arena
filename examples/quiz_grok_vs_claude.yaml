# Cross-vendor match: Grok (OpenAI-compatible endpoint) vs local claude.
# Set these environment variables first:
#   export ARENA_OPENAI_BASE_URL=https://api.x.ai/v1
#   export ARENA_OPENAI_API_KEY=xai-...
mode: quiz
seed: 1
ratings_path: runs/ratings.json
timeout_seconds: 120
mode_config:
  questions:
    - id: cap-jp
      prompt: "What is the capital of Japan?"
      answer: "Tokyo"
      kind: contains
    - id: math-1
      prompt: "What is 17 times 23? Answer with the number only."
      answer: "391"
      kind: numeric
    - id: logic-1
      prompt: "A is taller than B, and B is taller than C. Who is the shortest? Answer with one letter only."
      answer: "C"
      kind: contains
agents:
  - id: grok
    adapter: openai_compat
    model: grok-4.20
    system_prompt: "Output only the final answer, no explanation."
    prompt_author: team-grok
    params:
      base_url_env: ARENA_OPENAI_BASE_URL
      api_key_env: ARENA_OPENAI_API_KEY
  - id: claude
    adapter: claude_cli
    system_prompt: "Output only the final answer, no explanation."
    prompt_author: team-claude
