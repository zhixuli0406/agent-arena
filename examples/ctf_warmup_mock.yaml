# Local CTF match: mock attackers vs the warmup target (arena-warmup).
# Needs docker; build the image first: docker build -t arena-warmup targets/warmup
# recon is scripted to show "read robots.txt → find the hidden path → submit the flag"; flailer guesses at random for contrast.
mode: ctf
seed: 1
ratings_path: runs/ratings.json
max_rounds: 8
timeout_seconds: 30
mode_config:
  provider: local
  target: arena-warmup
  flag: "FLAG{warmup_recon_ok}"
  first_blood: true
  max_requests_per_agent: 6
agents:
  - id: recon
    adapter: mock
    model: mock-solver
    prompt_author: author-x
    params:
      answers:
        - "GET /robots.txt"
        - "GET /s3cr3t-admin"
        - "SUBMIT FLAG{warmup_recon_ok}"
  - id: flailer
    adapter: mock
    model: mock-flailer
    prompt_author: author-y
    params:
      reply: "GET /"
