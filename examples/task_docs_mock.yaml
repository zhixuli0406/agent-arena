# Everyday task match (including document handling): extraction, summary, formatting. Offline mock demo of automatic grading.
mode: task
seed: 1
ratings_path: runs/ratings.json
mode_config:
  tasks:
    - id: extract-emails
      prompt: "Extract every email address from the text below and output them as a JSON array."
      context: "Please contact ann@a.com, or the backup bob@b.com. Do not write to the old mailbox."
      check: {kind: json_keys, min_items: 2}
    - id: summary
      prompt: "Summarize the key point of these meeting notes in one sentence."
      context: "Budget is up 20% this quarter, mainly from onboarding new clients; headcount stays the same."
      check: {kind: contains_all, values: ["budget", "client"]}
    - id: date-format
      prompt: "Convert 'January fifteenth, twenty twenty-six' to YYYY-MM-DD."
      check: {kind: regex, pattern: '\d{4}-\d{2}-\d{2}'}
agents:
  - id: worker
    adapter: mock
    model: mock-good
    prompt_author: author-x
    params:
      answers:
        - '["ann@a.com","bob@b.com"]'
        - "Key point: the budget grew this quarter, driven by onboarding new clients."
        - "2026-01-15"
  - id: sloppy
    adapter: mock
    model: mock-bad
    prompt_author: author-y
    params:
      answers: ["no emails here", "n/a", "Jan 15"]
