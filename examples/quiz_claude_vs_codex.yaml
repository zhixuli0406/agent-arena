# Real cross-vendor match: Claude (claude CLI) vs OpenAI (codex CLI).
# Each uses its own local login; no keys go in this config.
mode: quiz
seed: 1
ratings_path: runs/ratings.json
timeout_seconds: 150
max_wall_seconds: 400
mode_config:
  questions:
    - id: cap-jp
      prompt: "What is the capital of Japan? Answer with the city name only."
      answer: "Tokyo"
      kind: contains
    - id: math-1
      prompt: "What is 17 times 23? Answer with the number only."
      answer: "391"
      kind: numeric
agents:
  - id: claude
    adapter: claude_cli
    system_prompt: "Output only the final answer, no explanation."
    prompt_author: team-anthropic
  - id: codex
    adapter: codex_cli
    system_prompt: "Reply with only the final answer, no explanation."
    prompt_author: team-openai
