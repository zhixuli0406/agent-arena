# Roster uses the three vendor names you picked (each driven by a scriptable agent):
#   Claude Duet → claude_cli (Duet has no public API, so Claude Code plays for it)
#   OpenAI dots → codex_cli
#   Grok bot    → grok_cli
# Each uses its own local login; no keys.
mode: quiz
seed: 1
ratings_path: runs/ratings.json
timeout_seconds: 150
max_wall_seconds: 500
mode_config:
  questions:
    - id: cap-jp
      prompt: "What is the capital of Japan? Answer with the city name only."
      answer: "Tokyo"
      kind: contains
agents:
  - id: "Claude Duet"
    adapter: claude_cli
    system_prompt: "Output only the final answer, no explanation."
    prompt_author: team-anthropic
  - id: "OpenAI dots"
    adapter: codex_cli
    system_prompt: "Reply with only the final answer."
    prompt_author: team-openai
  - id: "Grok bot"
    adapter: grok_cli
    system_prompt: "Reply with only the final answer."
    prompt_author: team-xai
