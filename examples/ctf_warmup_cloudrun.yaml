# Cloud CTF match: deploys the warmup target as a Cloud Run service (free tier, deleted afterwards).
# Deploys with a service account per the gcp-deploy rules; needs a local SA key and gcloud.
# Deployment takes a while, so max_wall_seconds is raised.
mode: ctf
seed: 1
ratings_path: runs/ratings.json
max_rounds: 8
timeout_seconds: 30
max_wall_seconds: 600
mode_config:
  provider: cloudrun
  target: arena-warmup
  flag: "FLAG{cloudrun_recon_ok}"
  first_blood: true
  max_requests_per_agent: 6
  ttl_seconds: 1800
agents:
  - id: recon
    adapter: mock
    model: mock-solver
    prompt_author: author-x
    params:
      answers:
        - "GET /robots.txt"
        - "GET /s3cr3t-admin"
        - "SUBMIT FLAG{cloudrun_recon_ok}"
  - id: flailer
    adapter: mock
    model: mock-flailer
    prompt_author: author-y
    params:
      reply: "GET /"
